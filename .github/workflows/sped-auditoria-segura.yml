name: SPED - Auditoria Tributaria Segura

on:
  push:
    branches:
      - fix/auditoria-tributaria-sped-seguranca-20261119
  pull_request:
    paths:
      - src/sped/auditor_tributario.py
      - src/sped/corretor_tributario_assistido.py
      - src/sped/motor_sped.py
      - src/ui/janela_sped_inteligente.py
      - src/services/relatorio_auditoria_tributaria_service.py
      - src/services/referencias_auditoria_sped_service.py
      - src/services/ficha_assistida_sped_service.py
      - src/services/conferencia_st_xml_service.py
      - src/services/empresas_regimes_service.py
      - tests/test_referencias_auditoria_sped.py
      - tests/test_regime_automatico_sped_auditoria.py
      - tests/test_auditoria_diagnostico_cadastro_regras.py tests/test_conferencia_st_xml_pr27.py
      - tests/test_auditoria_sped_segura_18_3_5.py
      - tests/test_relatorio_auditoria_tributaria_visual.py
      - tests/test_auditoria_sem_regras_18_3_5.py
      - tests/test_auditoria_diagnostico_xml_18_3_5.py
      - tests/test_auditoria_multiplas_pastas_nfe_nfce.py
      - tests/test_auditoria_cobertura_xml_c170.py
      - tests/test_auditoria_regra_banco_isolado.py
      - tests/test_ficha_assistida_sped_service.py
      - tests/test_triagem_st_condicional_pr27.py
      - src/services/triagem_st_condicional_service.py
      - src/services/diagnostico_cobertura_banco_pr27_service.py
      - tests/test_diagnostico_cobertura_banco_pr27.py
      - tests/test_conferencia_st_xml_pr27.py
      - .github/workflows/sped-auditoria-segura.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest openpyxl reportlab pillow pypdf
      - name: Verificar sintaxe e regressao
        run: |
          python -m compileall -q src/sped/auditor_tributario.py src/sped/corretor_tributario_assistido.py src/sped/motor_sped.py src/ui/janela_sped_inteligente.py src/services/relatorio_auditoria_tributaria_service.py src/services/referencias_auditoria_sped_service.py src/services/ficha_assistida_sped_service.py src/services/conferencia_st_xml_service.py src/services/triagem_st_condicional_service.py src/services/diagnostico_cobertura_banco_pr27_service.py
          python -m pytest -q tests/test_auditoria_sped_segura_18_3_5.py tests/test_relatorio_auditoria_tributaria_visual.py tests/test_auditoria_sem_regras_18_3_5.py tests/test_auditoria_diagnostico_xml_18_3_5.py tests/test_auditoria_multiplas_pastas_nfe_nfce.py tests/test_auditoria_cobertura_xml_c170.py tests/test_referencias_auditoria_sped.py tests/test_auditoria_regra_banco_isolado.py tests/test_ficha_assistida_sped_service.py tests/test_regime_automatico_sped_auditoria.py tests/test_auditoria_diagnostico_cadastro_regras.py tests/test_triagem_st_condicional_pr27.py tests/test_diagnostico_cobertura_banco_pr27.py
