name: NCM semantic regression

on:
  pull_request:
    paths:
      - "src/services/auditoria_cadastros_excel_service.py"
      - "src/services/ncm_validador_semantico_service.py"
      - "src/inteligencia/base_oficial/repositorio.py"
      - "tests/test_ncm*.py"
      - ".github/workflows/ncm-semantic-regression.yml"

jobs:
  ncm-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: NCM regression tests
        run: >
          python -m pytest -q
          tests/test_ncm_semantico_geral_18_2_22.py
          tests/test_ncm_validacao_existente_18_2_1.py
          tests/test_ncm_semantico_18_1_9.py
          tests/test_ncm_zerado_descricao_18_1_8.py
          tests/test_ncm_candidatos_18_1_10.py
