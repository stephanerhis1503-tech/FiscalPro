name: ICMS saidas Lucro Presumido regression

on:
  pull_request:
    paths:
      - "src/sped/exclusor_icms_saidas_presumido.py"
      - "src/ui/janela_sped_inteligente.py"
      - "tests/test_icms_saidas_lucro_presumido_20261112.py"
      - ".github/workflows/icms-saidas-presumido.yml"

jobs:
  icms-presumido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies
        run: python -m pip install --upgrade pip pytest openpyxl
      - name: Syntax
        run: python -m py_compile src/sped/exclusor_icms_saidas_presumido.py src/ui/janela_sped_inteligente.py
      - name: Regressions
        run: python -m pytest -q tests/test_icms_saidas_lucro_presumido_20261112.py
