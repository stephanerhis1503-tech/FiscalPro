name: ST - preservacao das correcoes

on:
  push:
    branches:
      - melhoria/st-preservacao-e-desempenho
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'dados/**'
      - 'requirements.txt'
      - '.github/workflows/st-preservacao.yml'

permissions:
  contents: read

concurrency:
  group: st-preservacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolado
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dependencias de teste
        run: python -m pip install pytest -r requirements.txt

      - name: Preservar fontes versionadas para verificacao
        run: |
          mkdir -p verificacao
          git rev-parse HEAD > verificacao/commit.txt
          git archive --format=zip --output=verificacao/fontes-teste.zip HEAD src tests dados samples templates requirements.txt main.py

      - name: Validar sintaxe sem iniciar o programa
        run: python -m compileall -q src tests main.py

      - name: Testar preservacao da comparacao de texto
        env:
          FISCALPRO_DATA_DIR: ${{ runner.temp }}/fiscalpro-st-focados
        run: python -m pytest -q tests/test_similaridade_textual_preservacao.py tests/test_st_descricao_mva_preservacao.py tests/test_ncm_semantico_geral_18_2_22.py tests/test_ncm_semantico_18_1_9.py --junitxml=verificacao/focados.xml

      - name: Medir busca NCM sem alterar base fiscal
        run: python -m tests.benchmark_similaridade_textual > verificacao/benchmark.json

      - name: Executar testes existentes sem ocultar falhas anteriores
        if: ${{ !cancelled() }}
        env:
          FISCALPRO_DATA_DIR: ${{ runner.temp }}/fiscalpro-st-completo
        run: python -m pytest -q tests --junitxml=verificacao/resultados.xml --durations=15

      - name: Guardar evidencias dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: st-preservacao-${{ github.sha }}
          path: verificacao/
          retention-days: 3
          if-no-files-found: error
